# Install and build from the npm workspace root, not apps/web.
[build]
  base = "."
  command = "npm run verify"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--include=dev"

# No API keys belong in this file. The app asks for a key at runtime.
# /docs/, /docs/sdk/, and /docs/components/ are generated static HTML pages.
# Directory index files support direct visits without a client-side rewrite.
